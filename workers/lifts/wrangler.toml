# lifts.jakehartson.com — personal StrongLifts 5×5 tracker (static Worker).
# Live behind Cloudflare Access. Keep workers_dev/preview_urls off so Access can't be bypassed.
name = "lifts"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Run the Worker for every request so security/noindex headers attach to assets too.
run_worker_first = true
